# Render Blueprint for Zetime Backend Service Only
version: "1"

services:
  # ---------------------------------------------------------------------------
  # Express Node.js Backend Service
  # ---------------------------------------------------------------------------
  - type: web
    name: zetime-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://zetime-backend-dmlv.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://twwmcoqipwqihlhxczvq.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_3_ygC_Dr3BUXVX6qt3VmDQ_Q1ViHWbl
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
